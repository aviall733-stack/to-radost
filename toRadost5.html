<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Radost — Ultimate Kitchen Hub 2026</title>
    <style>
        :root {
            --primary: #fbbf24; --primary-dark: #f59e0b;
            --bg: #f8fafc; --card: #ffffff;
            --text: #0f172a; --text-light: #64748b;
            --border: #e2e8f0; --accent: #10b981;
            --sale: #ef4444; --timer-bg: #1e293b;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 1200px; min-height: 95vh; background: var(--card); border-radius: 32px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); display: flex; flex-direction: column; margin: 20px 0; }
        header { padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fff; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.6rem; color: var(--primary-dark); cursor: pointer; text-transform: uppercase; }
        
        .btn-signup { background: var(--text); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-signup:hover { background: var(--primary-dark); color: var(--text); }

        #main-screen, #results-screen, #recipe-card-screen { padding: 30px 40px; animation: fadeIn 0.4s ease-out; }

        .controls-row { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .search-input { flex-grow: 1; padding: 15px 20px; border: 2px solid var(--border); border-radius: 14px; font-size: 1rem; outline: none; }
        .sort-select { padding: 15px; border: 2px solid var(--border); border-radius: 14px; background: #fff; font-weight: 600; cursor: pointer; }

        .cuisine-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .tab { padding: 8px 18px; background: #f1f5f9; border-radius: 10px; cursor: pointer; font-weight: 600; white-space: nowrap; font-size: 14px; }
        .tab.active { background: var(--primary); color: #451a03; }

        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .recipe-item-card { background: #fff; border: 1px solid var(--border); border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; }
        .recipe-item-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .recipe-item-card img { width: 100%; height: 160px; object-fit: cover; }
        .recipe-item-info { padding: 15px; }

        .sale-badge { position: absolute; top: 10px; right: 10px; background: var(--sale); color: white; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; z-index: 5; }

        .timer-panel { background: var(--timer-bg); color: white; padding: 25px; border-radius: 24px; margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
        .timer-display { font-size: 3rem; font-weight: 800; font-family: monospace; color: var(--primary); }
        .timer-controls { display: flex; gap: 10px; }
        .timer-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .timer-btn:hover { background: var(--primary); color: #000; }

        .nutrients-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .nutrient-item { text-align: center; background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
        .nutrient-val { display: block; font-weight: 800; font-size: 14px; }
        .nutrient-label { font-size: 10px; color: var(--text-light); text-transform: uppercase; }

        .pro-tip { background: #fffbeb; border-left: 4px solid var(--primary); padding: 15px; border-radius: 12px; margin: 20px 0; font-style: italic; color: #92400e; }
        .ingredient-card { background: #f8fafc; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
        .ingredient-card.checked { opacity: 0.4; text-decoration: line-through; background: #e2e8f0; }
        .checkbox { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--text-light); position: relative; }
        .checked .checkbox { background: var(--accent); border-color: var(--accent); }
        .checked .checkbox::after { content: '✓'; color: white; position: absolute; left: 2px; top: -3px; font-size: 12px; }

        .recipe-content { display: grid; grid-template-columns: 350px 1fr; gap: 40px; }
        .step-item { display: flex; gap: 15px; margin-bottom: 20px; }
        .step-num { width: 28px; height: 28px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }

        .btn-primary { background: var(--primary); color: #451a03; border: none; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn-back { background: #f1f5f9; color: var(--text); border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 15px; }

        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }
        @media (max-width: 900px) { .recipe-content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo" onclick="location.reload()">To Radost</div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div id="global-timer-status" style="font-size: 12px; font-weight: 800; color: var(--sale);"></div>
            <button class="btn-signup" onclick="alert('Registration opening soon!')">Sign Up</button>
        </div>
    </header>

    <div id="main-screen">
        <h2 style="font-size: 2rem; font-weight: 900; margin: 0 0 10px 0;">Kitchen Assistant 2026</h2>
        <div class="controls-row">
            <input type="text" id="recipe-search" class="search-input" placeholder="Search 25 master recipes..." oninput="render()">
            <select id="sort-order" class="sort-select" onchange="render()">
                <option value="default">Featured</option>
                <option value="sale">Most Discounts ⚡</option>
                <option value="price-low">Cheapest Total 💰</option>
                <option value="kcal-low">Low Calorie 🥗</option>
                <option value="diff-low">Easiest to Cook 🍳</option>
            </select>
        </div>
        <div class="cuisine-tabs">
            <div class="tab active" onclick="setCategory('All', this)">All</div>
            <div class="tab" onclick="setCategory('Slovak', this)">🇸🇰 Slovak</div>
            <div class="tab" onclick="setCategory('Italian', this)">🇮🇹 Italian</div>
            <div class="tab" onclick="setCategory('American', this)">🇺🇸 American</div>
            <div class="tab" onclick="setCategory('European', this)">🇪🇺 European</div>
            <div class="tab" onclick="setCategory('Bakery', this)">🥐 Bakery</div>
        </div>
        <div class="recipe-grid" id="recipe-grid"></div>
    </div>

    <div id="results-screen" class="hidden">
        <button class="btn-back" onclick="showScreen('main')">← Back to Menu</button>
        <div id="results-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px;"></div>
    </div>

    <div id="recipe-card-screen" class="hidden">
        <button class="btn-back" onclick="showScreen('results')">← Back to Market</button>
        <div class="timer-panel">
            <div><div id="timer-display" class="timer-display">00:00</div></div>
            <div class="timer-controls">
                <button class="timer-btn" onclick="setTimer(5)">5m</button>
                <button class="timer-btn" onclick="setTimer(10)">10m</button>
                <button class="timer-btn" onclick="setTimer(20)">20m</button>
                <button id="timer-toggle" class="timer-btn" style="background: var(--accent);" onclick="toggleTimer()">START</button>
                <button class="timer-btn" style="background: var(--sale);" onclick="resetTimer()">RESET</button>
            </div>
        </div>
        <div style="display: flex; gap: 30px; align-items: center; margin-bottom: 30px; flex-wrap: wrap;">
            <img id="recipe-img" style="width: 150px; height: 150px; border-radius: 24px; object-fit: cover; border: 4px solid var(--primary);">
            <div style="flex: 1;">
                <h1 id="recipe-title" style="margin:0; font-size: 2.5rem;"></h1>
                <p id="recipe-meta" style="color: var(--text-light); font-weight: 700; margin: 5px 0;"></p>
                <div id="recipe-nutrients" class="nutrients-grid" style="max-width: 400px;"></div>
            </div>
        </div>
        <div class="recipe-content">
            <div>
                <h3>Ingredients & Prep</h3>
                <div id="inventory-list" style="padding: 12px; background: #fef3c7; border-radius: 12px; margin-bottom:15px; font-weight:700; color:var(--primary-dark); font-size: 13px;"></div>
                <div id="ingredients-list"></div>
            </div>
            <div>
                <h3>Cooking Method</h3>
                <div id="steps-list"></div>
                <div id="pro-tip" class="pro-tip"></div>
            </div>
        </div>
    </div>
</div>

];    let currentCat = 'All';
    let timerInterval = null;
    let timerSeconds = 0;

    function render() {
        const grid = document.getElementById('recipe-grid');
        const search = document.getElementById('recipe-search').value.toLowerCase();
        const sort = document.getElementById('sort-order').value;
        let list = RECIPES.filter(r => (currentCat==='All' || r.cat===currentCat) && r.title.toLowerCase().includes(search));
        
        if(sort === 'sale') {
            list.sort((a,b) => (b.ingredients.filter(i=>i.sale).length) - (a.ingredients.filter(i=>i.sale).length));
        } else if(sort === 'kcal-low') {
            list.sort((a,b) => a.macros.k - b.macros.k);
        } else if(sort === 'price-low') {
            list.sort((a,b) => {
                const priceA = a.ingredients.reduce((sum, i) => sum + i.l, 0);
                const priceB = b.ingredients.reduce((sum, i) => sum + i.l, 0);
                return priceA - priceB;
            });
        } else if(sort === 'diff-low') {
            list.sort((a,b) => a.difficulty - b.difficulty);
        }

        grid.innerHTML = list.map(r => `
            <div class="recipe-item-card" onclick="selectFromGrid('${r.title.replace(/'/g, "\\'")}')">
                ${r.ingredients.some(i=>i.sale) ? `<div class="sale-badge">⚡ ${r.ingredients.filter(i=>i.sale).length} SALES</div>` : ''}
                <img src="${r.hero}">
                <div class="recipe-item-info">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:10px; font-weight:800; color:var(--primary-dark);">${r.cat.toUpperCase()}</span>
                        <span style="font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase;">${'★'.repeat(r.difficulty)}${'☆'.repeat(3-r.difficulty)}</span>
                    </div>
                    <h4 style="margin:5px 0; font-size:14px;">${r.title}</h4>
                    <div style="font-size:11px; font-weight:700; color:var(--text-light);">🔥 ${r.macros.k} kcal</div>
                </div>
            </div>
        `).join('');
    }

    function selectFromGrid(title) {
        const r = RECIPES.find(x => x.title === title);
        const container = document.getElementById('results-container');
        container.innerHTML = '';
        
        ['Lidl', 'Billa'].forEach(store => {
            const key = store === 'Lidl' ? 'l' : 'b';
            const total = r.ingredients.reduce((s,i) => s + i[key], 0);
            container.innerHTML += `
                <div style="background:white; padding:25px; border-radius:24px; border:2px solid var(--border);">
                    <div style="font-weight:800; font-size:12px; opacity:0.6;">${store.toUpperCase()} MARKET</div>
                    <div style="font-size:36px; font-weight:900; margin:10px 0;">€${total.toFixed(2)}</div>
                    <div style="margin:15px 0;">
                        ${r.ingredients.map(i => `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #f1f5f9; font-size:14px;">
                            <span>${i.n}</span>
                            <span>${i.sale ? `<span style="text-decoration:line-through; font-size:12px; opacity:0.5;">€${i.old}</span> ` : ''} <b>€${i[key]}</b></span>
                        </div>`).join('')}
                    </div>
                    <button class="btn-primary" onclick="goToFinalRecipe('${r.title.replace(/'/g, "\\'")}','${store}',${total})">Buy & Cook</button>
                </div>
            `;
        });
        showScreen('results');
    }

    function goToFinalRecipe(title, store, price) {
        const r = RECIPES.find(x => x.title === title);
        document.getElementById('recipe-img').src = r.hero;
        document.getElementById('recipe-title').innerText = r.title;
        document.getElementById('recipe-meta').innerText = `🛒 Purchased via ${store} for €${price.toFixed(2)}`;
        document.getElementById('inventory-list').innerHTML = "🛠️ <b>Required Tools:</b> " + r.inv.join(", ");
        document.getElementById('pro-tip').innerHTML = `<b>Chef's Tip:</b> ${r.tip}`;
        
        document.getElementById('recipe-nutrients').innerHTML = `
            <div class="nutrient-item"><span class="nutrient-val">${r.macros.k}</span><span class="nutrient-label">kcal</span></div>
            <div class="nutrient-item"><span class="nutrient-val">${r.macros.p}g</span><span class="nutrient-label">Protein</span></div>
            <div class="nutrient-item"><span class="nutrient-val">${r.macros.f}g</span><span class="nutrient-label">Fats</span></div>
            <div class="nutrient-item"><span class="nutrient-val">${r.macros.c}g</span><span class="nutrient-label">Carbs</span></div>
        `;

        document.getElementById('ingredients-list').innerHTML = r.ingredients.map(i => `
            <div class="ingredient-card" onclick="this.classList.toggle('checked')">
                <div class="checkbox"></div><span>${i.n}</span>
            </div>
        `).join('');

        document.getElementById('steps-list').innerHTML = r.steps.map((s, idx) => `
            <div class="step-item">
                <div class="step-num">${idx+1}</div>
                <div><b>${s.t}</b><p style="margin:4px 0; font-size:14px; color:var(--text-light);">${s.d}</p></div>
            </div>
        `).join('');
        
        showScreen('recipe-card');
    }

    function setTimer(m) { resetTimer(); timerSeconds = m * 60; updateTimerDisplay(); }
    function toggleTimer() {
        const btn = document.getElementById('timer-toggle');
        if (timerInterval) { 
            clearInterval(timerInterval); 
            timerInterval = null; 
            btn.innerText = "START"; 
        } else {
            if (timerSeconds <= 0) return;
            btn.innerText = "PAUSE";
            timerInterval = setInterval(() => {
                timerSeconds--; 
                updateTimerDisplay();
                if (timerSeconds <= 0) { 
                    clearInterval(timerInterval); 
                    timerInterval = null; 
                    alert("Timer Finished!"); 
                    btn.innerText = "START"; 
                }
            }, 1000);
        }
    }
    function resetTimer() { 
        clearInterval(timerInterval); 
        timerInterval = null; 
        timerSeconds = 0; 
        updateTimerDisplay(); 
        document.getElementById('timer-toggle').innerText = "START"; 
    }
    function updateTimerDisplay() {
        const m = Math.floor(timerSeconds/60); 
        const s = timerSeconds%60;
        document.getElementById('timer-display').innerText = `${m}:${s.toString().padStart(2,'0')}`;
    }
    function setCategory(c, el) { 
        currentCat = c; 
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); 
        el.classList.add('active'); 
        render(); 
    }
    function showScreen(s) { 
        document.querySelectorAll('.app-container > div').forEach(d => { if(d.id) d.classList.add('hidden'); }); 
        document.getElementById(s + '-screen').classList.remove('hidden'); 
        window.scrollTo(0,0); 
    }

    render();
</script>
