<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Radost — Search & Compare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fbbf24; --primary-dark: #f59e0b;
            --bg: #f8fafc; --card: #ffffff;
            --text: #0f172a; --text-light: #64748b;
            --border: #e2e8f0; --accent: #10b981;
            --sale: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 1200px; min-height: 95vh; background: var(--card); border-radius: 40px; overflow: hidden; box-shadow: 0 40px 100px -20px rgba(0,0,0,0.1); position: relative; }
        
        header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: #fff; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.6rem; color: var(--primary-dark); letter-spacing: -1.5px; cursor: pointer; text-transform: uppercase; }

        /* Стили поиска */
        .search-container { padding: 20px 40px; background: #fff; border-bottom: 1px solid var(--border); }
        .search-wrapper { position: relative; width: 100%; max-width: 500px; }
        .search-input { 
            width: 100%; padding: 15px 25px; border-radius: 20px; border: 2px solid var(--border); 
            font-size: 1rem; font-weight: 600; outline: none; 
        }
        .search-input:focus { border-color: var(--primary); background: #fffef2; }

        .screen { padding: 30px 40px; animation: fadeIn 0.4s ease-out; }
        .hidden { display: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        
        .card { 
            background: #fff; border: 1px solid var(--border); border-radius: 30px; 
            padding: 12px; cursor: pointer; display: flex; flex-direction: column; height: 380px; 
        }
        .card:hover { border-color: var(--primary); transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.05); }

        .img-box { width: 100%; height: 220px; background: #f1f5f9; border-radius: 22px; overflow: hidden; margin-bottom: 15px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .card-info { padding: 0 10px; }
        .card h3 { margin: 0 0 8px 0; font-weight: 800; font-size: 1.2rem; }
        
        .tag { display: inline-block; padding: 5px 12px; background: #f0fdf4; color: var(--accent); border-radius: 10px; font-size: 13px; font-weight: 900; }

        .back-nav { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 800; color: var(--text-light); margin-bottom: 25px; padding: 12px; border-radius: 12px; background: #f1f5f9; }
        
        .shop-box { background: #f8fafc; border-radius: 28px; padding: 25px; margin-bottom: 25px; border: 1px solid var(--border); position: relative; }
        .best-deal { border-color: var(--accent); background: #f0fdf4; }
        .brand-item { background: #fff; padding: 15px 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid var(--border); }
        .p-val { font-weight: 900; font-size: 1.3rem; }
        .p-val.highlight { color: var(--accent); }

        .add-btn { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 12px; font-weight: 900; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo" onclick="showMain()">To Radost</div>
        <div style="font-weight: 900; background: #f1f5f9; padding: 10px 20px; border-radius: 12px;">🛒 <span id="cart-count">0</span></div>
    </header>

    <!-- Поиск доступен только на главном экране -->
    <div id="search-bar" class="search-container">
        <div class="search-wrapper">
            <input type="text" id="product-search" class="search-input" placeholder="Search for food (e.g. Milk, Salmon...)" oninput="filterProducts()">
        </div>
    </div>

    <div id="main-screen" class="screen">
        <h1 id="main-title" style="font-size: 2.2rem; font-weight: 900; margin: 0 0 10px 0; letter-spacing: -1.5px;">Premium Market</h1>
        <div class="grid" id="category-grid"></div>
    </div>

    <div id="shop-screen" class="screen hidden">
        <div class="back-nav" onclick="showMain()">← BACK TO ALL</div>
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
            <div id="det-img" style="width: 100px; height: 100px; border-radius: 25px; overflow: hidden;"></div>
            <h1 id="det-name" style="margin:0; font-size: 2.5rem; letter-spacing: -1px;"></h1>
        </div>
        <div id="shops-list"></div>
    </div>
</div>

    ];

    const STORE_CONFIG = {
        "Lidl": ["Pilos", "Milbona", "Dulano Bio"],
        "Kaufland": ["K-Classic", "K-Favorites", "K-Bio"],
        "Billa": ["Clever", "Billa Brand", "Billa Bio"],
        "Tesco": ["Tesco Choice", "Tesco Finest", "Organic"]
    };

    function generateFullShops(item) {
        return ["Lidl", "Kaufland", "Billa", "Tesco"].map(store => {
            const basePrice = 2.50 + Math.random() * 0.5;
            return {
                name: store,
                brands: [
                    { n: STORE_CONFIG[store][0], p: basePrice.toFixed(2), t: "Budget" },
                    { n: STORE_CONFIG[store][1], p: (basePrice + 1.2).toFixed(2), t: "Standard" },
                    { n: STORE_CONFIG[store][2], p: Math.min(6.00, basePrice + 2.4).toFixed(2), t: "Premium" }
                ]
            };
        });
    }

    const FULL_DATA = PRODUCTS_DATA.map(item => ({ ...item, shops: generateFullShops(item) }));
    let cart = 0;

    function renderMain(filteredData = FULL_DATA) {
        const grid = document.getElementById('category-grid');
        if (filteredData.length === 0) {
            grid.innerHTML = '<p style="padding: 20px; font-weight: 700; color: var(--text-light);">No products found...</p>';
            return;
        }
        grid.innerHTML = filteredData.map((item) => {
            const minP = Math.min(...item.shops.flatMap(s => s.brands.map(b => parseFloat(b.p))));
            // Ищем оригинальный индекс в FULL_DATA для открытия деталей
            const originalIndex = FULL_DATA.findIndex(p => p.name === item.name);
            return `
                <div class="card" onclick="showProduct(${originalIndex})">
                    <div class="img-box"><img src="${item.img}" alt="${item.name}"></div>
                    <div class="card-info">
                        <h3>${item.name}</h3>
                        <div class="tag">FROM €${minP.toFixed(2)}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterProducts() {
        const query = document.getElementById('product-search').value.toLowerCase();
        const filtered = FULL_DATA.filter(item => item.name.toLowerCase().includes(query));
        renderMain(filtered);
    }

    function showProduct(idx) {
        const p = FULL_DATA[idx];
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('search-bar').classList.add('hidden'); // Прячем поиск в деталях
        document.getElementById('shop-screen').classList.remove('hidden');
        document.getElementById('det-name').innerText = p.name;
        document.getElementById('det-img').innerHTML = `<img src="${p.img}" style="width:100%;height:100%;object-fit:cover;">`;

        const min = Math.min(...p.shops.flatMap(s => s.brands.map(b => parseFloat(b.p))));
        const list = document.getElementById('shops-list');
        
        list.innerHTML = p.shops.sort((a,b) => Math.min(...a.brands.map(x=>x.p)) - Math.min(...b.brands.map(x=>x.p))).map(shop => {
            const isBestShop = shop.brands.some(b => parseFloat(b.p) === min);
            return `
                <div class="shop-box ${isBestShop ? 'best-deal' : ''}">
                    <div style="font-weight:900; margin-bottom:20px; font-size:1.5rem; color:#1e293b;">${shop.name}</div>
                    ${shop.brands.map(b => `
                        <div class="brand-item">
                            <div style="display:flex; flex-direction:column;">
                                <span style="font-size:10px; color:var(--text-light); font-weight:800;">${b.t}</span>
                                <strong style="font-size:1.1rem;">${b.n}</strong>
                            </div>
                            <div style="display:flex; align-items:center; gap:15px;">
                                <span class="p-val ${parseFloat(b.p) === min ? 'highlight' : ''}">€${b.p}</span>
                                <button class="add-btn" onclick="addToCart()">+</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }).join('');
        window.scrollTo(0,0);
    }

    function showMain() {
        document.getElementById('shop-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('search-bar').classList.remove('hidden');
    }

    function addToCart() { cart++; document.getElementById('cart-count').innerText = cart; }
renderMain();

function addToCart(productName, shopName, brandName, price)
    const newItem = {
        id: Date.now() + Math.random(),
        prod: productName,
        shop: shopName,
        brand: brandName,
        price: parseFloat(price)
    };

    cartItems.push(newItem); 
    updateCartCounter();     
}


    

</script>
