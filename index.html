<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Radost — Full Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fbbf24; --primary-dark: #f59e0b;
            --bg: #f1f5f9; --card: #ffffff;
            --text: #0f172a; --text-light: #64748b;
            --border: #e2e8f0; --accent: #10b981;
            --danger: #ef4444; --sale-bg: #fff1f2;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 1300px; min-height: 95vh; background: var(--card); border-radius: 50px; overflow: hidden; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.15); position: relative; }
        
        header { padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: #fff; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.8rem; color: var(--primary-dark); letter-spacing: -2px; cursor: pointer; text-transform: uppercase; }

        .nav-btns { display: flex; gap: 15px; align-items: center; }
        .btn-base { font-weight: 800; padding: 12px 24px; border-radius: 16px; cursor: pointer; border: none; font-size: 0.95rem; }
        .cart-trigger { background: #f1f5f9; position: relative; }
        .reg-trigger { background: var(--text); color: #fff; }
        
        #cart-count { background: var(--danger); color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; position: absolute; top: -5px; right: -5px; }

        .search-container { padding: 30px 50px; background: #fff; border-bottom: 1px solid var(--border); }
        .search-input { width: 100%; max-width: 600px; padding: 18px 30px; border-radius: 25px; border: 2px solid var(--border); font-size: 1.1rem; font-weight: 600; outline: none; }

        .screen { padding: 40px 50px; animation: fadeIn 0.4s ease-out; }
        .hidden { display: none; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
        @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card { background: #fff; border: 1px solid var(--border); border-radius: 35px; padding: 15px; cursor: pointer; height: 380px; display: flex; flex-direction: column; }
        .card:hover { border-color: var(--primary); transform: translateY(-8px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.05); }

        .img-box { width: 100%; height: 180px; background: #f8fafc; border-radius: 25px; overflow: hidden; margin-bottom: 15px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .shop-box { background: #f8fafc; border-radius: 40px; padding: 35px; margin-bottom: 30px; border: 1px solid var(--border); }
        .brand-item { background: #fff; padding: 20px 30px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid var(--border); }
        
        .add-btn { background: var(--primary); border: none; width: 50px; height: 50px; border-radius: 18px; font-weight: 900; cursor: pointer; font-size: 1.3rem; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 25px 35px; background: #fff; border: 1px solid var(--border); border-radius: 30px; margin-bottom: 15px; }
        .cart-controls { display: flex; align-items: center; gap: 30px; }
        .cart-price { font-weight: 900; font-size: 1.5rem; color: var(--text); }
        
        .del-btn { background: #fee2e2; color: #ef4444; border: none; padding: 12px 20px; border-radius: 14px; font-weight: 800; cursor: pointer; }
        .del-btn:hover { background: #fecaca; transform: scale(1.05); }

        .total-bar { margin-top: 40px; padding: 40px; background: var(--text); color: #fff; border-radius: 35px; display: flex; justify-content: space-between; align-items: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo" onclick="showMain()">To Radost</div>
        <div class="nav-btns">
            <button class="btn-base reg-trigger" onclick="showAuth()">Sign Up</button>
            <button class="btn-base cart-trigger" onclick="showCart()">🛒 Cart <span id="cart-count">0</span></button>
        </div>
    </header>

    <div id="search-bar" class="search-container">
        <input type="text" id="product-search" class="search-input" placeholder="Search across 20 products..." oninput="filterProducts()">
    </div>

    <div id="main-screen" class="screen">
        <h2 style="font-weight:900; font-size:1.6rem; margin-bottom:25px;">Slovak Supermarkets Comparison</h2>
        <div class="grid" id="category-grid"></div>
    </div>

    <div id="shop-screen" class="screen hidden">
        <button class="btn-base" style="margin-bottom:30px; background:#f1f5f9;" onclick="showMain()">← Back to Catalog</button>
        <div style="display: flex; align-items: center; gap: 30px; margin-bottom: 40px;">
            <div id="det-img" style="width: 140px; height: 140px; border-radius: 35px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.1);"></div>
            <div>
                <h1 id="det-name" style="margin:0; font-size: 2.8rem; font-weight: 900;"></h1>
                <p style="color: var(--text-light); margin: 10px 0 0 0; font-size: 1.1rem; font-weight: 600;">16 price points found</p>
            </div>
        </div>
        <div id="shops-list"></div>
    </div>

    <div id="cart-screen" class="screen hidden">
        <button class="btn-base" style="margin-bottom:30px; background:#f1f5f9;" onclick="showMain()">← Continue Shopping</button>
        <div id="cart-list"></div>
        <div id="cart-empty" style="text-align:center; padding: 100px; font-weight: 800; color: var(--text-light);">Your list is empty.</div>
        <div id="cart-total-container" class="hidden">
            <div class="total-bar"><span style="font-size:1.4rem;">Total:</span><span id="total-price" style="font-size:2.2rem; color:var(--primary); font-weight:900;">€0.00</span></div>
        </div>
    </div>

    <!-- AUTH SCREEN WITH FORM -->
    <div id="auth-screen" class="screen hidden">
        <div style="max-width: 450px; margin: 40px auto; padding: 50px; background: #f8fafc; border-radius: 40px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.05);">
            <h2 style="font-weight:900; margin-bottom: 10px;">Create Account</h2>
            <p style="color: var(--text-light); margin-bottom: 30px; font-weight: 600;">Join To Radost to save your lists</p>
            
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="display:block; margin-bottom:8px; font-weight:800; font-size:0.9rem;">Email Address</label>
                <input type="email" placeholder="name@example.com" style="width:100%; padding:15px; border-radius:15px; border:2px solid var(--border); outline:none; font-weight:600;">
            </div>

            <div style="text-align: left; margin-bottom: 30px;">
                <label style="display:block; margin-bottom:8px; font-weight:800; font-size:0.9rem;">Password</label>
                <input type="password" placeholder="••••••••" style="width:100%; padding:15px; border-radius:15px; border:2px solid var(--border); outline:none; font-weight:600;">
            </div>

            <button onclick="showMain()" class="btn-base reg-trigger" style="width:100%; padding:18px; font-size:1.1rem; margin-bottom:15px;">Create Account</button>
            <button onclick="showMain()" style="background:none; border:none; color:var(--text-light); font-weight:700; cursor:pointer;">Cancel</button>
        </div>
    </div>
</div>

        "Ripe Avocado": "https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=500"
    };

    const FULL_DATA = Object.keys(IMGS).map(name => ({
        name,
        img: IMGS[name],
        shops: SUPERMARKETS.map(shopName => ({
            name: shopName,
            brands: BRAND_TYPES.map(type => ({
                n: `${shopName} ${type}`,
                p: (1.0 + Math.random() * 9).toFixed(2)
            }))
        }))
    }));

    function hideAll() {
        ['main-screen', 'shop-screen', 'cart-screen', 'auth-screen', 'search-bar'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
    }

    function showMain() {
        hideAll();
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('search-bar').classList.remove('hidden');
        renderMain();
    }

    function showProduct(productName) {
        const p = FULL_DATA.find(x => x.name === productName);
        hideAll();
        document.getElementById('shop-screen').classList.remove('hidden');
        document.getElementById('det-name').innerText = p.name;
        document.getElementById('det-img').innerHTML = `<img src="${p.img}" style="width:100%;height:100%;object-fit:cover;">`;

        document.getElementById('shops-list').innerHTML = p.shops.map(shop => `
            <div class="shop-box">
                <div style="font-weight:900; margin-bottom:25px; color:var(--primary-dark); font-size:1.5rem; text-transform:uppercase;">${shop.name}</div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    ${shop.brands.map(b => `
                        <div class="brand-item">
                            <div><strong style="font-size:1.1rem;">${b.n}</strong></div>
                            <div style="display:flex; align-items:center; gap:20px;">
                                <span style="font-weight:900; font-size:1.4rem;">€${b.p}</span>
                                <button class="add-btn" onclick="addToCart('${p.name}', '${shop.name}', '${b.n}', '${b.p}')">+</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function addToCart(p, s, b, pr) {
        cartItems.push({ id: Date.now() + Math.random(), p, s, b, price: parseFloat(pr) });
        document.getElementById('cart-count').innerText = cartItems.length;
    }

    function showCart() {
        hideAll();
        document.getElementById('cart-screen').classList.remove('hidden');
        renderCart();
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const totalCont = document.getElementById('cart-total-container');
        document.getElementById('cart-empty').classList.toggle('hidden', cartItems.length > 0);
        totalCont.classList.toggle('hidden', cartItems.length === 0);
        
        let total = 0;
        list.innerHTML = cartItems.map(item => {
            total += item.price;
            return `
            <div class="cart-item">
                <div>
                    <strong style="font-size:1.3rem; display:block; margin-bottom:4px;">${item.p}</strong>
                    <span style="color:var(--text-light); font-weight:600;">${item.s} • ${item.b}</span>
                </div>
                <div class="cart-controls">
                    <span class="cart-price">€${item.price.toFixed(2)}</span>
                    <button class="del-btn" onclick="removeFromCart(${item.id})">Remove</button>
                </div>
            </div>`;
        }).join('');
        document.getElementById('total-price').innerText = `€${total.toFixed(2)}`;
    }

    function removeFromCart(id) {
        cartItems = cartItems.filter(i => i.id !== id);
        document.getElementById('cart-count').innerText = cartItems.length;
        renderCart();
    }

    function renderMain(data = FULL_DATA) {
        const grid = document.getElementById('category-grid');
        grid.innerHTML = data.map(p => `
            <div class="card" onclick="showProduct('${p.name}')">
                <div class="img-box"><img src="${p.img}"></div>
                <h3 style="margin:0; font-size:1.2rem; font-weight:800;">${p.name}</h3>
                <p style="margin-top:10px; color:var(--text-light); font-size:0.9rem; font-weight:600;">Compare 16 prices</p>
            </div>
        `).join('');
    }

    function filterProducts() {
        const val = document.getElementById('product-search').value.toLowerCase();
        renderMain(FULL_DATA.filter(p => p.name.toLowerCase().includes(val)));
    }

    function showAuth() { hideAll(); document.getElementById('auth-screen').classList.remove('hidden'); }

    showMain();
</script>
