<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Radost — Smart Shopping</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fbbf24; --primary-dark: #f59e0b;
            --bg: #f8fafc; --card: #ffffff;
            --text: #0f172a; --text-light: #64748b;
            --border: #e2e8f0; --accent: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 1200px; min-height: 95vh; background: var(--card); border-radius: 40px; overflow: hidden; box-shadow: 0 40px 100px -20px rgba(0,0,0,0.1); position: relative; }
        
        header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: #fff; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 1.6rem; color: var(--primary-dark); letter-spacing: -1.5px; cursor: pointer; text-transform: uppercase; }

        .cart-trigger { font-weight: 900; background: #f1f5f9; padding: 10px 20px; border-radius: 12px; cursor: pointer; border: none; font-size: 1rem; }
        .cart-trigger:hover { background: var(--primary); }

        .search-container { padding: 20px 40px; background: #fff; border-bottom: 1px solid var(--border); }
        .search-wrapper { position: relative; width: 100%; max-width: 500px; }
        .search-input { width: 100%; padding: 15px 25px; border-radius: 20px; border: 2px solid var(--border); font-size: 1rem; font-weight: 600; outline: none; }
        .search-input:focus { border-color: var(--primary); background: #fffef2; }

        .screen { padding: 30px 40px; animation: fadeIn 0.3s ease-out; }
        .hidden { display: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .card { background: #fff; border: 1px solid var(--border); border-radius: 30px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; height: 360px; }
        .card:hover { border-color: var(--primary); transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.05); }

        .img-box { width: 100%; height: 200px; background: #f1f5f9; border-radius: 22px; overflow: hidden; margin-bottom: 15px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .tag { display: inline-block; padding: 5px 12px; background: #f0fdf4; color: var(--accent); border-radius: 10px; font-size: 12px; font-weight: 900; margin-bottom: 8px; }

        .back-nav { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 800; color: var(--text-light); margin-bottom: 25px; padding: 12px 20px; border-radius: 15px; background: #f1f5f9; border: none; }
        
        .shop-box { background: #f8fafc; border-radius: 28px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); }
        .brand-item { background: #fff; padding: 15px 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid var(--border); }
        
        .add-btn { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 12px; font-weight: 900; cursor: pointer; }

        /* Стили корзины */
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #fff; border: 1px solid var(--border); border-radius: 20px; margin-bottom: 12px; }
        .del-btn { background: #fee2e2; color: var(--danger); border: none; padding: 8px 12px; border-radius: 10px; font-weight: 800; cursor: pointer; }
        .total-bar { margin-top: 30px; padding: 30px; background: var(--text); color: #fff; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo" onclick="showMain()">To Radost</div>
        <button class="cart-trigger" onclick="showCart()">🛒 <span id="cart-count">0</span></button>
    </header>

    <div id="search-bar" class="search-container">
        <div class="search-wrapper">
            <input type="text" id="product-search" class="search-input" placeholder="Search for food..." oninput="filterProducts()">
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen" class="screen">
        <h1 style="font-size: 2.2rem; font-weight: 900; margin: 0 0 25px 0; letter-spacing: -1.5px;">Premium Market</h1>
        <div class="grid" id="category-grid"></div>
    </div>

    <!-- ЭКРАН ВЫБОРА МАГАЗИНА -->
    <div id="shop-screen" class="screen hidden">
        <button class="back-nav" onclick="showMain()">← BACK</button>
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
            <div id="det-img" style="width: 80px; height: 80px; border-radius: 20px; overflow: hidden; background: #eee;"></div>
            <h1 id="det-name" style="margin:0; font-size: 2rem;"></h1>
        </div>
        <div id="shops-list"></div>
    </div>

    <!-- ЭКРАН КОРЗИНЫ -->
    <div id="cart-screen" class="screen hidden">
        <button class="back-nav" onclick="showMain()">← CONTINUE SHOPPING</button>
        <h1 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 25px;">Your Shopping List</h1>
        <div id="cart-list"></div>
        <div id="cart-empty" style="text-align:center; padding: 50px; color: var(--text-light); font-weight: 700;">Your cart is empty</div>
        <div id="cart-total-container" class="hidden">
            <div class="total-bar">
                <span style="font-size: 1.2rem; font-weight: 700;">Estimated Total:</span>
                <span id="total-price" style="font-size: 2rem; font-weight: 900; color: var(--primary);">€0.00</span>
            </div>
        </div>
    </div>
</div>

<script>
    let cartItems = [];
    
    const PRODUCTS_DATA = [
        { name: "Mozzarella", img: "https://images.unsplash.com/photo-1559561853-08451507cbe7?w=400" },
        { name: "Fresh Milk", img: "https://images.unsplash.com/photo-1550583724-125581fe2f8a?w=400" },
        { name: "Butter", img: "https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=400" },
        { name: "Beef Steak", img: "https://images.unsplash.com/photo-1600891964599-f61ba0e24092?w=400" },
        { name: "Chicken Fillet", img: "https://images.unsplash.com/photo-1604503468506-a8da13d82791?w=400" },
        { name: "Organic Eggs", img: "https://images.unsplash.com/photo-1506976785307-8732e854ad03?w=400" },
        { name: "Coffee", img: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=400" },
        { name: "Dark Chocolate", img: "https://images.unsplash.com/photo-1511381939415-e44015466834?w=400" },
        { name: "Olive Oil", img: "https://images.immediate.co.uk/production/volatile/sites/30/2020/02/OliveOil-bc8d7aa.jpg?quality=90&resize=400,363" },
        { name: "Bananas", img: "https://images.unsplash.com/photo-1571771894821-ad9b58866408?w=400" },
        { name: "Apples", img: "https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=400" },
        { name: "Potatoes", img: "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=400" },
        { name: "Tomatoes", img: "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400" },
        { name: "Fresh Bread", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400" },
        { name: "Honey", img: "https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=400" },
        { name: "Salmon", img: "https://images.unsplash.com/photo-1485921325833-c519f76c4927?w=400" },
        { name: "Pasta", img: "https://images.unsplash.com/photo-1551462147-ff29053bfc14?w=400" },
        { name: "Yogurt", img: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=400" },
        { name: "Cucumbers", img: "https://images.unsplash.com/photo-1449300079323-02e209d9d02d?w=400" },
        { name: "Avocado", img: "https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=400" }
    ];

    const STORE_CONFIG = {
        "Lidl": ["Pilos", "Milbona", "Dulano Bio"],
        "Kaufland": ["K-Classic", "K-Favorites", "K-Bio"],
        "Billa": ["Clever", "Billa Brand", "Billa Bio"],
        "Tesco": ["Tesco Choice", "Tesco Finest", "Organic"]
    };

    const FULL_DATA = PRODUCTS_DATA.map(item => ({
        ...item,
        shops: Object.keys(STORE_CONFIG).map(store => {
            const basePrice = 1.10 + Math.random() * 3;
            return {
                name: store,
                brands: [
                    { n: STORE_CONFIG[store][0], p: basePrice.toFixed(2), t: "Budget" },
                    { n: STORE_CONFIG[store][1], p: (basePrice + 0.6).toFixed(2), t: "Standard" },
                    { n: STORE_CONFIG[store][2], p: (basePrice + 1.4).toFixed(2), t: "Premium" }
                ]
            };
        })
    }));

    // ЛОГИКА КОРЗИНЫ
    function addToCart(pName, sName, bName, price) {
        cartItems.push({ id: Date.now(), product: pName, shop: sName, brand: bName, price: parseFloat(price) });
        updateCartUI();
    }

    function removeFromCart(id) {
        cartItems = cartItems.filter(item => item.id !== id);
        updateCartUI();
        renderCart();
    }

    function updateCartUI() {
        document.getElementById('cart-count').innerText = cartItems.length;
    }

    // НАВИГАЦИЯ
    function hideAll() {
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('shop-screen').classList.add('hidden');
        document.getElementById('cart-screen').classList.add('hidden');
        document.getElementById('search-bar').classList.add('hidden');
    }

    function showMain() {
        hideAll();
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('search-bar').classList.remove('hidden');
    }

    function showCart() {
        hideAll();
        document.getElementById('cart-screen').classList.remove('hidden');
        renderCart();
    }

    function showProduct(productName) {
        const p = FULL_DATA.find(x => x.name === productName);
        hideAll();
        document.getElementById('shop-screen').classList.remove('hidden');
        document.getElementById('det-name').innerText = p.name;
        document.getElementById('det-img').innerHTML = `<img src="${p.img}">`;

        document.getElementById('shops-list').innerHTML = p.shops.map(shop => `
            <div class="shop-box">
                <div style="font-weight:900; margin-bottom:15px; font-size:1.1rem; color:var(--primary-dark);">${shop.name}</div>
                ${shop.brands.map(b => `
                    <div class="brand-item">
                        <div><small style="color:var(--text-light)">${b.t}</small><br><strong>${b.n}</strong></div>
                        <div style="display:flex; align-items:center; gap:15px;">
                            <span style="font-weight:900;">€${b.p}</span>
                            <button class="add-btn" onclick="addToCart('${p.name}', '${shop.name}', '${b.n}', '${b.p}')">+</button>
                        </div>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        const emptyMsg = document.getElementById('cart-empty');
        const totalCont = document.getElementById('cart-total-container');
        
        if (cartItems.length === 0) {
            list.innerHTML = '';
            emptyMsg.classList.remove('hidden');
            totalCont.classList.add('hidden');
            return;
        }

        emptyMsg.classList.add('hidden');
        totalCont.classList.remove('hidden');
        
        let total = 0;
        list.innerHTML = cartItems.map(item => {
            total += item.price;
            return `
                <div class="cart-item">
                    <div>
                        <strong style="font-size:1.1rem;">${item.product}</strong><br>
                        <small style="color:var(--text-light)">${item.shop} • ${item.brand}</small>
                    </div>
                    <div style="display:flex; align-items:center; gap:20px;">
                        <span style="font-weight:900; font-size:1.2rem;">€${item.price.toFixed(2)}</span>
                        <button class="del-btn" onclick="removeFromCart(${item.id})">Remove</button>
                    </div>
                </div>
            `;
        }).join('');
        
        document.getElementById('total-price').innerText = `€${total.toFixed(2)}`;
    }

    function renderMain(data = FULL_DATA) {
        const grid = document.getElementById('category-grid');
        grid.innerHTML = data.map(p => `
            <div class="card" onclick="showProduct('${p.name}')">
                <div class="img-box"><img src="${p.img}"></div>
                <div class="card-info">
                    <span class="tag">FRESH</span>
                    <h3 style="margin:0">${p.name}</h3>
                </div>
            </div>
        `).join('');
    }

    function filterProducts() {
        const val = document.getElementById('product-search').value.toLowerCase();
        renderMain(FULL_DATA.filter(p => p.name.toLowerCase().includes(val)));
    }

    renderMain();
</script>
</body>
</html>
